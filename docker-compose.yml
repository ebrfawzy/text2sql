services:
  text2sql:
    build: .
    env_file:
      - path: .env
        required: false
    volumes:
      # Mount source for live development
      - ./src:/app/src
      - ./configs:/app/configs

      # Mount datasets
      - ./data:/app/data

      # Mount results
      - ./results:/app/results

      # Persist cache
      - ./.cache:/app/.cache

    stdin_open: true
    tty: true
    ports:
      - "8000:8000"
