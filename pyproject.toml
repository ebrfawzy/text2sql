[build-system]
requires = ["uv_build>=0.7.2,<0.8"]
build-backend = "uv_build"

[project]
name = "text2sql-toolkit"
version = "0.1.0"
description = "An open-source Text-to-SQL framework with automatic database profiling, LangChain agents, and LiteLLM compatibility."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Ebrahim Abdelkhalek", email = "ebr.fawzy@gmail.com" },
]
keywords = ["text-to-sql", "llm", "database", "profiling", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # LLM layer
    "litellm>=1.97.0",
    # Database
    "sqlalchemy>=2.0.49",
    "sqlglot>=30.6.0",
    "sqlparse>=0.5.0",
    # Config & validation
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.0",
    "pyyaml>=6.0.3",
    # CLI
    "typer>=0.23.1",
    "rich>=15.0.0",
    # Prompt templates
    "jinja2>=3.1.6",
    # Profiling helpers
    "datasketch>=1.10.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.12",
]
mysql = [
    "pymysql>=1.1.2",
]
snowflake = [
    "snowflake-sqlalchemy>=1.9.0",
]
redshift = [
    "sqlalchemy-redshift>=0.8.14",
    "psycopg2-binary>=2.9.12",
    "boto3>=1.43.51",
]
athena = [
    "pyathena[sqlalchemy]>=3.0.0",
    "boto3>=1.43.51",
]
bedrock = [
    "boto3>=1.43.51",
]
api = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
]
lambda = [
    "boto3>=1.43.0",
    "mangum>=0.21.0",
]
benchmark = [
    "datasets>=4.8.5",
    # Imported by the vendored official evaluator (live_sql_bench_sqlite), which we run
    # unmodified — so it is a hard requirement of scoring, not an incidental transitive.
    "tqdm>=4.67.0",
]
all = [
    "text2sql-toolkit[postgres,mysql,snowflake,redshift,athena,bedrock,api,lambda,benchmark]",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.1.0",
    "ruff>=0.15.12",
    "mypy>=1.20.2",
    "pre-commit>=4.6.0",
]

[project.scripts]
text2sql = "text2sql.cli:main"

[project.urls]
Homepage = "https://github.com/ebrfawzy/text2sql"
Repository = "https://github.com/ebrfawzy/text2sql"
Documentation = "https://github.com/ebrfawzy/text2sql#readme"
Issues = "https://github.com/ebrfawzy/text2sql/issues"

[tool.uv]
package = true

[tool.uv.sources]

[tool.uv.build-backend]
# The project name is text2sql-toolkit but the Python package is text2sql.
module-name = "text2sql"
module-root = "src"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]
# LiveSQLBench release — never reformat, keep original
extend-exclude = ["src/text2sql/benchmark/live_sql_bench_sqlite"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]


[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
exclude = ["src/text2sql/benchmark/live_sql_bench_sqlite/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Async tests need no per-test marker — every `async def test_*` is collected.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
